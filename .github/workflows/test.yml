# Lint + tests unitaires à chaque push / PR. Aucun binaire Electron nécessaire
# (ELECTRON_SKIP_BINARY_DOWNLOAD) : tout ce qui est vérifié ici est de la logique pure.
#
# Le LINT est la pièce qui manquait. `node --check` ne voit que la syntaxe, or une ReferenceError
# (identifiant appelé sans être importé) est une erreur d'EXÉCUTION : une version est ainsi partie en
# production avec toute sa chaîne de mise à jour coupée, sans qu'aucun contrôle ne bronche.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test   # eslint . && node --test
      - run: node --check main.js && node --check preload.js && node --check discordrpc.js && node --check validators.js && node --check logic.js
